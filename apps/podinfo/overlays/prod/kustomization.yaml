apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml
  - certificate.yaml
  - ingress.yaml
namespace: podinfo-prod
patches:
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: flux-system
configMapGenerator:
  - name: podinfo-values
    namespace: podinfo-prod
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  immutable: true