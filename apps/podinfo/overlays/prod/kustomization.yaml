apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml
  - certificate.yaml
  - ingress.yaml
patches:
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: flux-system
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: podinfo-prod
configMapGenerator:
  - name: podinfo-values
    namespace: podinfo-prod
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true