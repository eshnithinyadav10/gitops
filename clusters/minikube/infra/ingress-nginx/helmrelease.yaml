apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 5m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: ingress-nginx-values
  upgrade:
    remediation:
      retries: 3
  rollback:
    enable: true
    remediation:
      retries: 2
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/type"]